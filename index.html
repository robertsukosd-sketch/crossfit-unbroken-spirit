          "@type": "FAQPage",
          "mainEntity": [
            { "@type": "Question", "name": "Ce înseamnă CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit este un program de antrenament bazat pe mișcări funcționale, variate constant și realizate la intensitate ridicată. Combină exerciții de forță, cardio și gimnastică pentru a îmbunătăți condiția fizică generală și performanța în activitățile din viața reală." } },
            { "@type": "Question", "name": "Ce înseamnă să fii în formă?", "acceptedAnswer": { "@type": "Answer", "text": "A fi în formă înseamnă să te descurci bine la orice sarcină fizică, nu doar la una anume. Greg Glassman a definit fitness-ul în 2002 prin trei standarde: competența în zece calități fizice, capacitatea de a duce la capăt o sarcină aleasă la întâmplare și pregătirea în toate cele trei sisteme energetice. Nu contează doar la ce ești bun, ci la câte nu ești slab." } },
            { "@type": "Question", "name": "Care sunt cele 10 calități fizice?", "acceptedAnswer": { "@type": "Answer", "text": "Rezistența cardio-respiratorie, anduranța, forța, flexibilitatea, puterea, viteza, coordonarea, agilitatea, echilibrul și precizia. Ești în formă exact în măsura în care ești competent la fiecare dintre ele, nu excelent la una singură." } },
            { "@type": "Question", "name": "Care e diferența dintre forță și putere?", "acceptedAnswer": { "@type": "Answer", "text": "Forța e cât de tare poți împinge sau trage. Puterea e cât de repede reușești — forță maximă aplicată în timp minim. Doi oameni pot ridica aceeași greutate, dar cel care o ridică mai repede are mai multă putere. Forța se construiește prin antrenament; puterea cere și antrenament, și practică." } },
            { "@type": "Question", "name": "Ce sunt sistemele energetice în sport?", "acceptedAnswer": { "@type": "Answer", "text": "Sunt cele trei căi prin care corpul produce energie: fosfagenul (eforturi sub 10 secunde, anaerob), sistemul glicolitic (până la câteva minute, anaerob) și sistemul oxidativ (eforturi lungi, aerob). Fitness-ul complet cere antrenament în toate trei — nu doar cardio de durată." } },
            { "@type": "Question", "name": "De ce nu e bine să te specializezi în antrenament?", "acceptedAnswer": { "@type": "Answer", "text": "Pentru că specializarea îți dă un vârf ascuțit și goluri mari. Viața, munca și majoritatea sporturilor cer eforturi pe care nu le poți alege dinainte. Cine e pregătit larg se descurcă onorabil la orice; specialistul e neajutorat în afara domeniului lui. De aceea în CrossFit specialitatea e să nu te specializezi." } },
            { "@type": "Question", "name": "Trebuie să fiu în formă înainte de a începe CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "Nu trebuie să fii în formă înainte de a începe CrossFit. CrossFit este exact procesul prin care ajungi în formă — membrii variază de la sportivi de elită la persoane care fac mișcare pentru prima dată." } },
            { "@type": "Question", "name": "Este CrossFit potrivit pentru începători?", "acceptedAnswer": { "@type": "Answer", "text": "Da, CrossFit este potrivit pentru începători. Fiecare mișcare poate fi adaptată (scalată) la nivelul tău, iar antrenorii te ghidează pas cu pas. La CrossFit Unbroken Spirit, prima clasă este gratuită tocmai pentru a-ți permite să testezi fără niciun angajament." } },
            { "@type": "Question", "name": "Cât costă un abonament la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Un abonament la CrossFit Unbroken Spirit costă de la 320 RON/lună pentru 8 clase. Abonamentul de 12 clase costă 400 RON/lună, iar cel nelimitat 500 RON/lună. Există și Personal Training și Open Gym." } },
            { "@type": "Question", "name": "Cât durează o clasă de CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "O clasă de CrossFit durează 60 de minute. Clasa include instructaj, încălzire ghidată, o sesiune de forță sau tehnică, antrenamentul zilei (WOD) și stretching." } },
            { "@type": "Question", "name": "Este CrossFitul periculos?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit nu este periculos când este predat corect. La CrossFit Unbroken Spirit folosim filozofia 'Mecanică, Consistență, apoi Intensitate' — înveți să te miști corect înainte de a crește viteza sau greutatea." } },
            { "@type": "Question", "name": "Cum pot ajunge la CrossFit Unbroken Spirit? Există parcare?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit Unbroken Spirit se află la Splaiul Unirii 257-259, București. Există parcare gratuită inclusă. Cea mai apropiată stație de metrou este Mihai Bravu, la 7-8 minute de mers pe jos." } },
            { "@type": "Question", "name": "Oferiți o clasă de probă gratuită?", "acceptedAnswer": { "@type": "Answer", "text": "Da, prima clasă este gratuită la CrossFit Unbroken Spirit pentru toți noii membri. Te poți înscrie direct prin formularul de pe unbrokenspirit.ro — nu ai nevoie de experiență anterioară." } },
            { "@type": "Question", "name": "De câte ori pe săptămână ar trebui să vin la CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "Începătorii ar trebui să vină la CrossFit de 3 ori pe săptămână pentru a permite corpului să se recupereze. Pe măsură ce progresezi, mulți membri aleg 4-5 zile pe săptămână pentru rezultate optime." } },
            { "@type": "Question", "name": "Pot slăbi făcând CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "Da, CrossFit te ajută să slăbești. Antrenamentele intense ard un număr mare de calorii, iar combinate cu o alimentație echilibrată și un deficit caloric consistent, CrossFit este eficient pentru pierderea în greutate." } },
            { "@type": "Question", "name": "Cum pot începe CrossFit la București?", "acceptedAnswer": { "@type": "Answer", "text": "Ca să începi CrossFit în București, rezervă o clasă gratuită la CrossFit Unbroken Spirit pe unbrokenspirit.ro. Sala se află la Splaiul Unirii 257-259, lângă metroul Mihai Bravu, cu parcare gratuită inclusă." } },
            { "@type": "Question", "name": "Ce echipamente are sala CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit Unbroken Spirit este dotată complet cu echipamente Rogue: haltere olimpice, kettlebells, rowing machines (rower), assault bike, ski erg, inele de gimnastică, bare de tracțiuni și platforme de haltere. Este una dintre cele mai bine dotate săli CrossFit din București." } },
            { "@type": "Question", "name": "Ce este Hyrox și pot să mă pregătesc pentru Hyrox la Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Hyrox este o competiție de fitness funcțional care combină alergarea cu 8 stații de lucru: rowing, ski erg, assault bike, sled push/pull și altele. La CrossFit Unbroken Spirit avem rower, assault bike și ski erg, deci te poți pregăti excelent pentru Hyrox în antrenamentele noastre de condiționare." } },
            { "@type": "Question", "name": "Există antrenamente de grup la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Da, toate clasele CrossFit sunt antrenamente de grup ghidate de antrenor. Fiecare clasă durează 60 de minute și se desfășoară în grupe mici, ceea ce garantează atenție individuală și o atmosferă de echipă motivantă. Există clase dimineața, la prânz și seara, de luni până sâmbătă." } },
            { "@type": "Question", "name": "Este CrossFit Unbroken Spirit o sală de fitness sau o sală CrossFit?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit Unbroken Spirit este o sală de fitness specializată în CrossFit, cu antrenamente de grup ghidate de antrenori certificați. Spre deosebire de o sală de fitness clasică, oferim programare zilnică, coaching inclus în abonament, echipamente profesionale (Rogue, rower, bike, ski erg) și o comunitate puternică." } },
            { "@type": "Question", "name": "Pot face rower, bike sau ski la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Da. CrossFit Unbroken Spirit este dotată cu rowing machines (rower), assault bike și ski erg, care sunt folosite în antrenamentele de condiționare și WOD-uri. Aceste echipamente sunt disponibile atât în clasele de grup, cât și în sesiunile de Open Gym." } },
            { "@type": "Question", "name": "Poate un angajat cu SanoPass să vină la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Da. CrossFit Unbroken Spirit este partener SanoPass și disponibil în rețeaua Gold. Angajații cu abonament SanoPass Gold pot accesa orice clasă de CrossFit sau Open Gym cu o taxă de drop-in redusă, fără să cumpere un abonament separat. Coplata se face direct din aplicația ThunderWOD." } },
            { "@type": "Question", "name": "Poate un angajat cu 7Card sau WellHub să vină la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Da. CrossFit Unbroken Spirit este partener 7Card by WellHub. Utilizatorii 7Card by Wellhub pot accesa sala fără nicio taxă suplimentară. Înscrierea la ore se face direct din aplicația ThunderWOD." } },
            { "@type": "Question", "name": "Pot plăti abonamentul CrossFit cu Edenred Benefit?", "acceptedAnswer": { "@type": "Answer", "text": "Da. Angajații cu card Edenred Benefit pot achiziționa abonamentele CrossFit Unbroken Spirit direct din platforma sau aplicația Edenred. Abonamentul se activează în cel mult 24 de ore în aplicația ThunderWOD, de unde te poți înscrie la ore." } },
            { "@type": "Question", "name": "Ce platforme de beneficii pentru angajați acceptă CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "CrossFit Unbroken Spirit acceptă SanoPass (Gold), 7Card by WellHub și Edenred Benefit. Dacă ai un abonament activ prin angajatorul tău pe una dintre aceste platforme, te poți antrena la noi cu costuri reduse sau acoperite integral. Întreabă departamentul HR dacă beneficiezi de aceste platforme." } },
            { "@type": "Question", "name": "Ce este Personal Training la CrossFit Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Personal Training la CrossFit Unbroken Spirit înseamnă antrenamente personalizate în București, în grup privat de cel mult 3 persoane. Fiecare ședință este adaptată obiectivelor tale: forță, slăbit, mobilitate, condiție fizică sau corectarea tehnicii." } },
            { "@type": "Question", "name": "Cât costă Personal Training în București la Unbroken Spirit?", "acceptedAnswer": { "@type": "Answer", "text": "Pachetele de Personal Training la CrossFit Unbroken Spirit costă 1300 RON pentru PT - 8 ședințe, 1400 RON pentru PT - 10 ședințe și 1600 RON pentru PT - 12 ședințe." } },
            { "@type": "Question", "name": "Pentru cine este potrivit Personal Trainingul?", "acceptedAnswer": { "@type": "Answer", "text": "Personal Trainingul este potrivit pentru începători, persoane care vor să slăbească, să crească forța, să își îmbunătățească mobilitatea sau să învețe mișcările de CrossFit corect și în siguranță." } },
            { "@type": "Question", "name": "Există CrossFit aproape de Sector 4 București?", "acceptedAnswer": { "@type": "Answer", "text": "Da. CrossFit Unbroken Spirit este pe Splaiul Unirii 257-259, foarte accesibil din Sector 4, zona Timpuri Noi, Tineretului, Văcărești și Berceni. Ai parcare gratuită și acces rapid de la metrou Mihai Bravu." } },
            { "@type": "Question", "name": "Unde pot face antrenament funcțional în București?", "acceptedAnswer": { "@type": "Answer", "text": "La CrossFit Unbroken Spirit faci antrenament funcțional ghidat de antrenori, cu exerciții de forță, cardio, gimnastică, haltere, rower, bike și ski erg, adaptate nivelului tău." } },
            { "@type": "Question", "name": "Este sala potrivită dacă locuiesc în Sector 3 sau Sector 4?", "acceptedAnswer": { "@type": "Answer", "text": "Da. Sala este poziționată între Sector 3 și Sector 4, pe Splaiul Unirii, aproape de Mihai Bravu, Timpuri Noi, Vitan, Tineretului și zona Văcărești." } },
            { "@type": "Question", "name": "Oferiți Personal Training în București?", "acceptedAnswer": { "@type": "Answer", "text": "Da. Oferim Personal Training în grup privat de maximum 3 persoane, pentru slăbit, forță, mobilitate, tehnică și condiție fizică generală." } }
